<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">aniscope: profile</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            background-color: #d8d8d8;
        }
        .nav-border {
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
        }
        .nav-tab {
            border-right: 1px dotted #a3a3a3;
            transition: none !important;
        }
        .nav-tab:first-child {
            border-left: 1px dotted #a3a3a3;
        }
        .nav-tab:hover {
            background-color: #4a4a4a;
        }
        .nav-tab:hover .tab-img {
            filter: invert(100%);
        }
        .btn-square {
            border-radius: 0px !important;
            transition: none !important;
        }
        .square-input {
            border-radius: 0px !important;
        }
        .profile-box {
            background-color: #f7f7f7;
            border: 1px solid #d0d0d0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-0 px-0 md:px-4">
    <div class="w-full max-w-[980px] bg-white min-h-screen shadow-sm flex flex-col">
        <div class="pt-1 pb-0 px-4">
            <div class="flex items-end justify-between">
                <a href="index.html" class="block">
                    <img src="logo.png" alt="aniscope" class="h-20 w-auto object-contain block" onerror="this.onerror=null; this.src='https://placehold.co/320x80/ffffff/111111?text=aniscope';" />
                </a>
                <div id="user-header-status" class="flex items-center space-x-3 font-semibold text-gray-700 text-[11px] pb-0.5">
                    <a href="login.html" class="hover:underline focus:outline-none">login</a>
                    <span>|</span>
                    <a href="signup.html" class="hover:underline focus:outline-none">sign up</a>
                </div>
            </div>
        </div>

        <div class="nav-border bg-[#f2f2f2] pl-0 pr-2 flex items-center justify-between">
            <nav class="flex items-stretch text-sm font-bold text-gray-800">
                <a href="index.html" class="nav-tab px-4 py-1 flex items-center justify-center overflow-hidden">
                    <img src="reviews.png" alt="reviews" class="h-8 w-auto tab-img scale-[1.5] transform" onerror="this.onerror=null; this.src='https://placehold.co/70x28/f2f2f2/111111?text=reviews';" />
                </a>
                <a href="index.html" class="nav-tab px-4 py-1 flex items-center justify-center overflow-hidden">
                    <img src="news.png" alt="news" class="h-8 w-auto tab-img scale-[1.5] transform" onerror="this.onerror=null; this.src='https://placehold.co/70x28/f2f2f2/111111?text=news';" />
                </a>
                <a href="index.html" class="nav-tab px-4 py-1 flex items-center justify-center overflow-hidden">
                    <img src="scopelist.png" alt="scopelist" class="h-8 w-auto tab-img scale-[1.5] transform" onerror="this.onerror=null; this.src='https://placehold.co/90x28/f2f2f2/111111?text=scopelist';" />
                </a>
                <a href="index.html" class="nav-tab px-2 py-1 flex items-center justify-center overflow-hidden">
                    <img src="as+.png" alt="as+" class="h-8 w-auto tab-img scale-[1.5] transform" onerror="this.onerror=null; this.src='https://placehold.co/50x28/f2f2f2/111111?text=as%2B';" />
                </a>
                <a href="index.html" class="nav-tab px-4 py-1 flex items-center justify-center overflow-hidden">
                    <img src="forums.png" alt="forums" class="h-8 w-auto tab-img scale-[1.5] transform" onerror="this.onerror=null; this.src='https://placehold.co/70x28/f2f2f2/111111?text=forums';" />
                </a>
                <a href="index.html" class="nav-tab px-4 py-1 flex items-center justify-center overflow-hidden">
                    <img src="about.png" alt="about" class="h-8 w-auto tab-img scale-[1.5] transform" onerror="this.onerror=null; this.src='https://placehold.co/60x28/f2f2f2/111111?text=about';" />
                </a>
            </nav>

            <form id="global-search-form" onsubmit="handleGlobalSearch(event)" class="flex items-center space-x-1 py-0.5">
                <div class="relative flex items-center">
                    <svg class="w-3.5 h-3.5 absolute left-2 text-gray-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="global-search-input" placeholder="Search" class="square-input pl-7 pr-2 py-0.5 text-xs bg-white border border-gray-300 w-44 focus:outline-none focus:border-gray-500" />
                </div>
                <button type="submit" class="focus:outline-none flex items-center cursor-pointer">
                    <img src="go.png" alt="GO" class="h-6 w-auto block" onerror="this.onerror=null; this.src='https://placehold.co/32x24/cc0000/ffffff?text=GO';" />
                </button>
            </form>
        </div>

        <main class="flex-1 bg-white p-6 md:p-8">
            <div class="max-w-4xl mx-auto flex flex-col space-y-6">
                <div id="profile-loading" class="py-12 text-center text-xs text-gray-500 italic">loading profile...</div>
                <div id="profile-content" class="hidden flex flex-col space-y-6">
                    <div class="profile-box p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <div class="flex items-center space-x-4">
                            <img id="profile-pfp" src="" alt="avatar" class="w-20 h-20 object-cover border border-gray-400" />
                            <div>
                                <h1 id="profile-username" class="text-lg font-bold text-gray-900"></h1>
                                <p id="profile-joined" class="text-xs text-gray-500 mt-0.5"></p>
                                <p id="profile-location" class="text-xs text-gray-600 mt-1"></p>
                            </div>
                        </div>
                        <div id="profile-actions" class="flex items-center space-x-2"></div>
                    </div>

                    <div class="bg-white border border-gray-300 p-6 flex flex-col space-y-2">
                        <h2 class="text-xs font-bold text-gray-900 uppercase tracking-wider border-b border-gray-200 pb-1">about me</h2>
                        <p id="profile-metext" class="text-xs text-gray-700 whitespace-pre-wrap leading-relaxed"></p>
                    </div>

                    <div class="bg-white border border-gray-300 p-6 flex flex-col space-y-4">
                        <h2 class="text-xs font-bold text-gray-900 uppercase tracking-wider border-b border-gray-200 pb-1">friends list</h2>
                        <div id="friends-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const DEFAULT_PFP = "https://firebasestorage.googleapis.com/v0/b/testing-interme.firebasestorage.app/o/default.png?alt=media&token=449044bb-5706-4251-aa7d-fc3da295e5f3";

        const firebaseConfig = {
            apiKey: "AIzaSyCywBwxsMjVWcI17BEyUUHXsKkaIq34VeM",
            authDomain: "testing-interme.firebaseapp.com",
            projectId: "testing-interme",
            storageBucket: "testing-interme.firebasestorage.app",
            messagingSenderId: "267474615661",
            appId: "1:267474615661:web:efcd2aa5a7b91017936e64",
            measurementId: "G-BL9G4PD8Z7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'aniscope';

        const savedSession = JSON.parse(localStorage.getItem('aniscope_session') || 'null');
        if (savedSession && savedSession.username) {
            const headerStatus = document.getElementById('user-header-status');
            if (headerStatus) {
                headerStatus.innerHTML = `
                    <span>welcome, <a href="profile.html?u=${encodeURIComponent(savedSession.username)}" class="hover:underline text-gray-900 font-bold">${savedSession.username}</a>!</span>
                `;
            }
        }

        window.handleGlobalSearch = function(event) {
            event.preventDefault();
            const q = document.getElementById('global-search-input').value.trim();
            if (q) {
                window.location.href = `search.html?query=${encodeURIComponent(q)}`;
            }
        };

        function getProfileUser() {
            const params = new URLSearchParams(window.location.search);
            let u = params.get('u');
            if (!u && savedSession && savedSession.username) {
                u = savedSession.username;
            }
            return u ? u.trim().toLowerCase() : null;
        }

        async function loadProfile() {
            const targetUsername = getProfileUser();
            const loadingEl = document.getElementById('profile-loading');
            const contentEl = document.getElementById('profile-content');

            if (!targetUsername) {
                loadingEl.innerText = "no user specified or not logged in.";
                return;
            }

            try {
                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUsername);
                const userSnap = await getDoc(userDocRef);

                if (!userSnap.exists()) {
                    loadingEl.innerText = `user "${targetUsername}" not found.`;
                    return;
                }

                const userData = userSnap.data();
                document.getElementById('page-title').innerText = `aniscope: ${userData.username}`;
                document.getElementById('profile-pfp').src = userData.pfp || DEFAULT_PFP;
                document.getElementById('profile-username').innerText = userData.username;
                document.getElementById('profile-joined').innerText = `joined: ${userData.createdAt ? new Date(userData.createdAt).toLocaleDateString() : 'unknown'}`;
                document.getElementById('profile-location').innerText = userData.location ? `location: ${userData.location}` : '';
                document.getElementById('profile-metext').innerText = userData.meText || 'no about me provided.';

                // Render actions (add friend / pending / remove friend)
                const actionsEl = document.getElementById('profile-actions');
                actionsEl.innerHTML = '';

                if (savedSession && savedSession.username.toLowerCase() === targetUsername) {
                    actionsEl.innerHTML = `<a href="settings.html" class="btn-square px-4 py-2 text-xs font-bold bg-black text-white hover:bg-gray-800">edit profile</a>`;
                } else if (savedSession) {
                    const currentUserKey = savedSession.username.toLowerCase();
                    const friends = userData.friends || [];
                    const friendRequests = userData.friendRequests || [];

                    const isFriend = friends.includes(currentUserKey);
                    const hasRequested = friendRequests.includes(currentUserKey);

                    if (isFriend) {
                        actionsEl.innerHTML = `<button onclick="handleRemoveFriend('${targetUsername}')" class="btn-square px-4 py-2 text-xs font-bold bg-gray-300 text-gray-800 hover:bg-gray-400">remove friend</button>`;
                    } else if (hasRequested) {
                        actionsEl.innerHTML = `<button disabled class="btn-square px-4 py-2 text-xs font-bold bg-gray-200 text-gray-500 cursor-not-allowed">friend request pending</button>`;
                    } else {
                        actionsEl.innerHTML = `<button onclick="handleSendFriendRequest('${targetUsername}')" class="btn-square px-4 py-2 text-xs font-bold bg-black text-white hover:bg-gray-800">add friend</button>`;
                    }
                }

                // Render friends
                const friendsContainer = document.getElementById('friends-container');
                friendsContainer.innerHTML = '';
                const friendList = userData.friends || [];

                if (friendList.length === 0) {
                    friendsContainer.innerHTML = `<p class="text-xs text-gray-500 italic col-span-full">no friends added yet.</p>`;
                } else {
                    for (const fName of friendList) {
                        try {
                            const fSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', fName));
                            const fData = fSnap.exists() ? fSnap.data() : { username: fName, pfp: DEFAULT_PFP };
                            const fCard = document.createElement('a');
                            fCard.href = `profile.html?u=${encodeURIComponent(fData.username)}`;
                            fCard.className = "flex items-center space-x-2 p-2 border border-gray-300 bg-[#f9f9f9] hover:bg-gray-100";
                            fCard.innerHTML = `
                                <img src="${fData.pfp || DEFAULT_PFP}" alt="${fData.username}" class="w-8 h-8 object-cover border border-gray-400" />
                                <span class="text-xs font-bold text-blue-600 truncate">${fData.username}</span>
                            `;
                            friendsContainer.appendChild(fCard);
                        } catch (e) {}
                    }
                }

                loadingEl.classList.add('hidden');
                contentEl.classList.remove('hidden');

            } catch (err) {
                console.error("Error loading profile:", err);
                loadingEl.innerText = "error loading profile.";
            }
        }

        window.handleSendFriendRequest = async function(targetUser) {
            if (!savedSession) return;
            try {
                const targetRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUser);
                await updateDoc(targetRef, {
                    friendRequests: arrayUnion(savedSession.username.toLowerCase())
                });
                alert("Friend request sent successfully!");
                loadProfile();
            } catch (err) {
                console.error("Error sending friend request:", err);
            }
        };

        window.handleRemoveFriend = async function(targetUser) {
            if (!savedSession) return;
            try {
                const currentUserKey = savedSession.username.toLowerCase();
                const targetRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', targetUser);
                const currentRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUserKey);

                await updateDoc(targetRef, { friends: arrayRemove(currentUserKey) });
                await updateDoc(currentRef, { friends: arrayRemove(targetUser) });

                loadProfile();
            } catch (err) {
                console.error("Error removing friend:", err);
            }
        };

        loadProfile();
    </script>
</body>
</html>

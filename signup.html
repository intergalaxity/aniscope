<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aniscope: sign up</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            background-color: #d8d8d8;
        }
        .nav-border {
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
        }
        .nav-tab {
            border-right: 1px dotted #a3a3a3;
            transition: none !important;
        }
        .nav-tab:first-child {
            border-left: 1px dotted #a3a3a3;
        }
        .nav-tab:hover {
            background-color: #4a4a4a;
        }
        .nav-tab:hover .tab-img {
            filter: invert(100%);
        }
        .btn-square {
            border-radius: 0px !important;
            transition: none !important;
        }
        input.square-input {
            border-radius: 0px !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-0 px-0 md:px-4">
    <div class="w-full max-w-[980px] bg-white min-h-screen shadow-sm flex flex-col">
        <div class="pt-1 pb-0 px-4">
            <div class="flex items-end justify-between">
                <a href="index.html" class="block">
                    <img src="logo.png" alt="aniscope" class="h-20 w-auto object-contain block" onerror="this.onerror=null; this.src='https://placehold.co/320x80/ffffff/111111?text=aniscope';" />
                </a>
                <div id="user-header-status" class="flex items-center space-x-3 font-semibold text-gray-700 text-[11px] pb-0.5">
                    <a href="login.html" class="hover:underline focus:outline-none">login</a>
                    <span>|</span>
                    <a href="signup.html" class="hover:underline focus:outline-none">sign up</a>
                </div>
            </div>
        </div>

        <div class="nav-border bg-[#f2f2f2] pl-0 pr-2 flex items-center justify-between">
            <nav class="flex items-stretch text-sm font-bold text-gray-800">
                <a href="index.html" class="nav-tab px-4 py-1 flex items-center justify-center overflow-hidden">
                    <img src="reviews.png" alt="reviews" class="h-8 w-auto tab-img scale-[1.5] transform" onerror="this.onerror=null; this.src='https://placehold.co/70x28/f2f2f2/111111?text=reviews';" />
                </a>
                <a href="index.html" class="nav-tab px-4 py-1 flex items-center justify-center overflow-hidden">
                    <img src="news.png" alt="news" class="h-8 w-auto tab-img scale-[1.5] transform" onerror="this.onerror=null; this.src='https://placehold.co/70x28/f2f2f2/111111?text=news';" />
                </a>
                <a href="index.html" class="nav-tab px-4 py-1 flex items-center justify-center overflow-hidden">
                    <img src="scopelist.png" alt="scopelist" class="h-8 w-auto tab-img scale-[1.5] transform" onerror="this.onerror=null; this.src='https://placehold.co/90x28/f2f2f2/111111?text=scopelist';" />
                </a>
                <a href="index.html" class="nav-tab px-2 py-1 flex items-center justify-center overflow-hidden">
                    <img src="as+.png" alt="as+" class="h-8 w-auto tab-img scale-[1.5] transform" onerror="this.onerror=null; this.src='https://placehold.co/50x28/f2f2f2/111111?text=as%2B';" />
                </a>
                <a href="index.html" class="nav-tab px-4 py-1 flex items-center justify-center overflow-hidden">
                    <img src="forums.png" alt="forums" class="h-8 w-auto tab-img scale-[1.5] transform" onerror="this.onerror=null; this.src='https://placehold.co/70x28/f2f2f2/111111?text=forums';" />
                </a>
                <a href="index.html" class="nav-tab px-4 py-1 flex items-center justify-center overflow-hidden">
                    <img src="about.png" alt="about" class="h-8 w-auto tab-img scale-[1.5] transform" onerror="this.onerror=null; this.src='https://placehold.co/60x28/f2f2f2/111111?text=about';" />
                </a>
            </nav>

            <div class="flex items-center space-x-1 py-0.5">
                <div class="relative flex items-center">
                    <svg class="w-3.5 h-3.5 absolute left-2 text-gray-500 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" placeholder="Search" class="pl-7 pr-2 py-0.5 text-xs bg-white border border-gray-300 rounded-none w-44 focus:outline-none focus:border-gray-500" />
                </div>
                <button type="button" class="focus:outline-none flex items-center">
                    <img src="go.png" alt="GO" class="h-6 w-auto block" onerror="this.onerror=null; this.src='https://placehold.co/32x24/cc0000/ffffff?text=GO';" />
                </button>
            </div>
        </div>

        <main class="flex-1 bg-white p-8 flex flex-col items-center justify-center py-16">
            <div class="w-full max-w-sm bg-[#e8e8e8] border border-gray-300 p-6 shadow-none flex flex-col items-center">
                <h1 class="text-xl font-bold text-gray-900 mb-1 text-center">welcome to aniscope!</h1>
                <p class="text-xs text-gray-600 mb-5 text-center">sign up to see reviews of your favorite anime, it's free.</p>

                <div id="error-msg" class="w-full bg-red-100 border border-red-400 text-red-700 text-xs p-2 mb-4 hidden text-center"></div>

                <form id="signup-form" class="w-full flex flex-col space-y-3" onsubmit="handleSignupSubmit(event)">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">email</label>
                        <input type="email" id="signup-email" oninput="validateForm()" placeholder="email" class="square-input w-full px-2.5 py-1.5 text-xs bg-white border border-gray-400 focus:outline-none focus:border-black rounded-none" />
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">username</label>
                        <input type="text" id="signup-username" oninput="validateForm()" placeholder="username" class="square-input w-full px-2.5 py-1.5 text-xs bg-white border border-gray-400 focus:outline-none focus:border-black rounded-none" />
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">password</label>
                        <input type="password" id="signup-password" oninput="validateForm()" placeholder="password" class="square-input w-full px-2.5 py-1.5 text-xs bg-white border border-gray-400 focus:outline-none focus:border-black rounded-none" />
                    </div>

                    <button type="submit" id="signup-btn" disabled class="btn-square w-full py-2 text-xs font-bold text-white bg-gray-400 cursor-not-allowed border-none rounded-none mt-2">
                        sign up
                    </button>
                </form>

                <div class="mt-4 text-center text-xs text-gray-700">
                    <a href="login.html" class="hover:underline font-semibold">already have an account? log in</a>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCywBwxsMjVWcI17BEyUUHXsKkaIq34VeM",
            authDomain: "testing-interme.firebaseapp.com",
            projectId: "testing-interme",
            storageBucket: "testing-interme.firebasestorage.app",
            messagingSenderId: "267474615661",
            appId: "1:267474615661:web:efcd2aa5a7b91017936e64",
            measurementId: "G-BL9G4PD8Z7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'aniscope';

        (function() {
            const savedSession = JSON.parse(localStorage.getItem('aniscope_session') || 'null');
            if (savedSession && savedSession.username) {
                const headerStatus = document.getElementById('user-header-status');
                headerStatus.innerHTML = `
                    <span class="text-gray-900 font-bold">welcome, ${savedSession.username}!</span>
                    <span>|</span>
                    <button onclick="handleLogout()" class="hover:underline focus:outline-none">logout</button>
                `;
            }
        })();

        window.handleLogout = function() {
            localStorage.removeItem('aniscope_session');
            window.location.reload();
        };

        window.validateForm = function() {
            const email = document.getElementById('signup-email').value.trim();
            const user = document.getElementById('signup-username').value.trim();
            const pass = document.getElementById('signup-password').value;
            const btn = document.getElementById('signup-btn');

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const userRegex = /^[a-zA-Z0-9_]{3,20}$/;

            if (emailRegex.test(email) && userRegex.test(user) && pass.length >= 1) {
                btn.disabled = false;
                btn.className = "btn-square w-full py-2 text-xs font-bold text-white bg-black cursor-pointer border-none rounded-none mt-2";
            } else {
                btn.disabled = true;
                btn.className = "btn-square w-full py-2 text-xs font-bold text-white bg-gray-400 cursor-not-allowed border-none rounded-none mt-2";
            }
        };

        window.handleSignupSubmit = async function(event) {
            event.preventDefault();

            const emailInput = document.getElementById('signup-email').value.trim();
            const usernameInput = document.getElementById('signup-username').value.trim();
            const passwordInput = document.getElementById('signup-password').value;
            const errorMsg = document.getElementById('error-msg');

            errorMsg.classList.add('hidden');
            errorMsg.innerText = '';

            try {
                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', usernameInput.toLowerCase());
                const userSnap = await getDoc(userDocRef);

                if (userSnap.exists()) {
                    errorMsg.innerText = "username is already taken.";
                    errorMsg.classList.remove('hidden');
                    return;
                }

                await setDoc(userDocRef, {
                    username: usernameInput,
                    email: emailInput,
                    password: passwordInput,
                    createdAt: new Date().toISOString()
                });

                localStorage.setItem('aniscope_session', JSON.stringify({
                    username: usernameInput,
                    email: emailInput
                }));

                window.location.href = 'index.html';

            } catch (err) {
                errorMsg.innerText = "failed to create account. please try again.";
                errorMsg.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
